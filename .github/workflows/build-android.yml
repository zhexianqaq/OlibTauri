name: Tauri2 Build Android (Unsigned APK, Self Use)
on:
  workflow_dispatch: # 只能网页手动点击运行，不用打tag

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable + android cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install npm dependencies
        run: npm install

      - name: Build unsigned release APK
        run: npm run tauri android build -- --apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-unsigned-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
